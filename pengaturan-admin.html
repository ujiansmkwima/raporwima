<script>
  lucide.createIcons();

  var content = document.getElementById('content');
  var topbarMeta = document.getElementById('topbarMeta');
  var tahunAktif = null;

  function escapeHtml(s) {
    return (s === null || s === undefined) ? '' : String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function setActiveMenu(view) {
    document.querySelectorAll('#menuAdmin .menu-item').forEach(function (m) {
      m.classList.toggle('menu-item--active', m.dataset.view === view);
    });
  }

  async function muatTahunAktif() {
    var r = await supabaseClient.from('tahun_ajaran').select('id, nama, semester').eq('is_aktif', true).maybeSingle();
    tahunAktif = r.data;
    topbarMeta.textContent = tahunAktif
      ? 'Tahun Ajaran Aktif: ' + tahunAktif.nama + ' — Semester ' + tahunAktif.semester
      : 'Belum ada tahun ajaran aktif — aktifkan salah satu di menu "Tahun Ajaran".';
  }

  // ================= PANEL: TAHUN AJARAN =================
  // ================= Profil Sekolah (singleton) =================
  // Satu baris data sekolah yang dipakai Cetak Rapor: Nama Sekolah,
  // Kepala Sekolah, dan Kota untuk baris tanda tangan. Disimpan/​
  // diperbarui lewat upsert onConflict=singleton, jadi selalu cuma
  // ada 1 baris di tabel profil_sekolah.
  async function renderProfilSekolah() {
    content.innerHTML = '<div class="panel-head"><div><div class="panel-head__title">Profil Sekolah</div>' +
      '<div class="panel-head__desc">Memuat data Profil Sekolah...</div></div></div>';

    var res = await supabaseClient.from('profil_sekolah').select('*').maybeSingle();
    var p = res.data || {};

    // Gambar tanda tangan Kepala Sekolah disimpan sebagai data URL
    // base64 langsung di kolom ttd_kepala_sekolah (bukan Supabase
    // Storage) supaya tidak perlu setup bucket terpisah. Disimpan di
    // variabel ini dulu (bukan langsung ke DB) supaya upload/hapus
    // bisa dibatalkan kalau form belum di-Simpan.
    var ttdDataUrl = p.ttd_kepala_sekolah || null;

    content.innerHTML =
      '<div class="panel-head"><div><div class="panel-head__title">Profil Sekolah</div>' +
      '<div class="panel-head__desc">Data ini dipakai otomatis di kepala Cetak Rapor, Cetak Data Sekolah (HAL 2 rapor) dan baris tanda tangan Kepala Sekolah — sekali diisi di sini, semua rapor/nilai tengah semester/nilai PKL yang dicetak wali kelas & guru memakai data yang sama.</div></div></div>' +
      '<form class="add-form" id="formProfilSekolah" style="flex-direction:column;align-items:stretch;max-width:520px;">' +
      '<div class="field"><label>Nama Sekolah</label><input type="text" id="psNamaSekolah" value="' + escapeHtml(p.nama_sekolah || '') + '" placeholder="SMK Widya Mandala Tambak" required></div>' +
      '<div class="field"><label>Alamat Sekolah (jalan / komplek / RT RW) — tampil di Cetak Data Sekolah</label><input type="text" id="psAlamatSekolah" value="' + escapeHtml(p.alamat_sekolah || '') + '" placeholder="Komplek ..., RT 04/ RW 03 Desa ..."></div>' +
      '<div class="field"><label>NPSN</label><input type="text" id="psNpsn" value="' + escapeHtml(p.npsn || '') + '" placeholder="69899923"></div>' +
      '<div class="field"><label>NSS (opsional, kosongkan kalau tidak ada)</label><input type="text" id="psNss" value="' + escapeHtml(p.nss || '') + '"></div>' +
      '<div class="field"><label>Kelurahan / Desa</label><input type="text" id="psKelurahan" value="' + escapeHtml(p.kelurahan || '') + '" placeholder="Purwodadi"></div>' +
      '<div class="field"><label>Kecamatan</label><input type="text" id="psKecamatan" value="' + escapeHtml(p.kecamatan || '') + '" placeholder="Kecamatan Tambak"></div>' +
      '<div class="field"><label>Kota / Kabupaten</label><input type="text" id="psKabKota" value="' + escapeHtml(p.kab_kota || '') + '" placeholder="Kabupaten Banyumas"></div>' +
      '<div class="field"><label>Provinsi</label><input type="text" id="psProvinsi" value="' + escapeHtml(p.provinsi || '') + '" placeholder="Jawa Tengah"></div>' +
      '<div class="field"><label>Website</label><input type="text" id="psWebsite" value="' + escapeHtml(p.website || '') + '" placeholder="http://www.contoh.sch.id"></div>' +
      '<div class="field"><label>Email Sekolah</label><input type="text" id="psEmail" value="' + escapeHtml(p.email || '') + '" placeholder="sekolah@gmail.com"></div>' +
      '<div class="field"><label>Nama Kepala Sekolah</label><input type="text" id="psKepalaSekolah" value="' + escapeHtml(p.kepala_sekolah || '') + '" placeholder="Agung Pambudi, S.E., S. Kom., M.M."></div>' +
      '<div class="field"><label>NIP Kepala Sekolah (opsional)</label><input type="text" id="psNipKepalaSekolah" value="' + escapeHtml(p.nip_kepala_sekolah || '') + '"></div>' +
      '<div class="field"><label>Kota (untuk baris tanda tangan, mis. "Tambak, ....... 2026")</label><input type="text" id="psKotaTtd" value="' + escapeHtml(p.kota_ttd || 'Tambak') + '" placeholder="Tambak"></div>' +
      '<div class="field"><label>Tanggal Rapor (untuk baris tanda tangan Cetak Rapor, mis. "Tambak, 12 Desember 2026")</label><input type="date" id="psTanggalRapor" value="' + escapeHtml(p.tanggal_rapor || '') + '"></div>' +
      '<div class="field"><label>Tanggal Tengah Semester (untuk baris tanda tangan Cetak Nilai Tengah Semester)</label><input type="date" id="psTanggalTengahSemester" value="' + escapeHtml(p.tanggal_tengah_semester || '') + '"></div>' +
      '<div class="field"><label>Tanggal Nilai PKL (untuk baris tanda tangan Cetak Nilai PKL)</label><input type="date" id="psTanggalPkl" value="' + escapeHtml(p.tanggal_pkl || '') + '"></div>' +
      '<div class="field">' +
        '<label>Tanda Tangan Kepala Sekolah (gambar)</label>' +
        '<div id="psTtdPreviewWrap" style="margin-bottom:8px;">' + renderTtdPreview(ttdDataUrl) + '</div>' +
        '<input type="file" id="psTtdFile" accept="image/png,image/jpeg,image/webp">' +
        '<div style="margin-top:6px;">' +
          '<button type="button" class="btn-small" id="psTtdHapus"' + (ttdDataUrl ? '' : ' disabled') + '>Hapus Tanda Tangan</button>' +
        '</div>' +
        '<div class="panel-note" style="margin:8px 0 0;padding:0;">Pakai foto/scan tanda tangan dengan latar putih atau PNG transparan. Gambar otomatis dikecilkan saat diupload.</div>' +
      '</div>' +
      '<div class="field">' +
        '<label>Tampilkan Tanda Tangan (gambar) di:</label>' +
        '<div style="display:flex;flex-direction:column;gap:6px;margin-top:4px;">' +
          '<label style="display:flex;align-items:center;gap:8px;font-weight:400;"><input type="checkbox" id="psTampilRapor"' + (p.tampil_ttd_rapor !== false ? ' checked' : '') + '> Cetak Rapor (+ Cetak Identitas)</label>' +
          '<label style="display:flex;align-items:center;gap:8px;font-weight:400;"><input type="checkbox" id="psTampilTengahSemester"' + (p.tampil_ttd_tengah_semester !== false ? ' checked' : '') + '> Cetak Nilai Tengah Semester</label>' +
          '<label style="display:flex;align-items:center;gap:8px;font-weight:400;"><input type="checkbox" id="psTampilPkl"' + (p.tampil_ttd_pkl !== false ? ' checked' : '') + '> Cetak Nilai PKL</label>' +
        '</div>' +
        '<div class="panel-note" style="margin:8px 0 0;padding:0;">Centang semua kalau tanda tangan mau dipakai di semua format cetak. Kalau tidak dicentang (atau belum ada gambar), ruang tanda tangan di format itu tetap kosong seperti biasa untuk ditandatangani tulis tangan.</div>' +
      '</div>' +
      '<button type="submit" class="btn-small btn-small--primary" style="align-self:flex-start;">Simpan</button>' +
      '</form>' +
      '<div id="profilSekolahMsg" style="margin-top:10px;"></div>';

    function renderTtdPreview(dataUrl) {
      if (!dataUrl) return '<div class="panel-note" style="margin:0;padding:0;">Belum ada tanda tangan diupload.</div>';
      return '<img src="' + dataUrl + '" alt="Tanda tangan Kepala Sekolah" style="max-height:70px;max-width:220px;object-fit:contain;border:1px solid var(--line,#e5e7eb);border-radius:6px;padding:4px;background:#fff;">';
    }

    // Mengecilkan gambar tanda tangan di sisi browser (lewat <canvas>)
    // sebelum disimpan sebagai data URL base64, supaya baris di tabel
    // profil_sekolah tidak membengkak walau file asli hasil scan/foto
    // besar. Lebar dibatasi maksimal 500px, tinggi menyesuaikan
    // (proporsional), diekspor sebagai PNG.
    function kecilkanGambarTtd(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onerror = function () { reject(new Error('Gagal membaca file.')); };
        reader.onload = function () {
          var img = new Image();
          img.onerror = function () { reject(new Error('File bukan gambar yang valid.')); };
          img.onload = function () {
            var LEBAR_MAKS = 500;
            var skala = img.width > LEBAR_MAKS ? (LEBAR_MAKS / img.width) : 1;
            var w = Math.round(img.width * skala);
            var h = Math.round(img.height * skala);
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/png'));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('psTtdFile').addEventListener('change', async function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var msg = document.getElementById('profilSekolahMsg');
      try {
        msg.textContent = 'Memproses gambar tanda tangan...';
        ttdDataUrl = await kecilkanGambarTtd(file);
        document.getElementById('psTtdPreviewWrap').innerHTML = renderTtdPreview(ttdDataUrl);
        document.getElementById('psTtdHapus').disabled = false;
        msg.textContent = 'Gambar siap — klik "Simpan" di bawah untuk menyimpannya.';
      } catch (err) {
        msg.textContent = 'Gagal memproses gambar: ' + (err && err.message ? err.message : err);
      } finally {
        e.target.value = '';
      }
    });

    document.getElementById('psTtdHapus').addEventListener('click', function () {
      ttdDataUrl = null;
      document.getElementById('psTtdPreviewWrap').innerHTML = renderTtdPreview(null);
      document.getElementById('psTtdHapus').disabled = true;
      document.getElementById('profilSekolahMsg').textContent = 'Tanda tangan akan dihapus — klik "Simpan" di bawah untuk menerapkannya.';
    });

    document.getElementById('formProfilSekolah').addEventListener('submit', async function (e) {
      e.preventDefault();
      var msg = document.getElementById('profilSekolahMsg');
      msg.textContent = 'Menyimpan...';

      var upd = await supabaseClient.from('profil_sekolah').upsert({
        singleton: true,
        nama_sekolah: document.getElementById('psNamaSekolah').value.trim() || 'SMK Widya Mandala Tambak',
        alamat_sekolah: document.getElementById('psAlamatSekolah').value.trim() || null,
        npsn: document.getElementById('psNpsn').value.trim() || null,
        nss: document.getElementById('psNss').value.trim() || null,
        kelurahan: document.getElementById('psKelurahan').value.trim() || null,
        kecamatan: document.getElementById('psKecamatan').value.trim() || null,
        kab_kota: document.getElementById('psKabKota').value.trim() || null,
        provinsi: document.getElementById('psProvinsi').value.trim() || null,
        website: document.getElementById('psWebsite').value.trim() || null,
        email: document.getElementById('psEmail').value.trim() || null,
        kepala_sekolah: document.getElementById('psKepalaSekolah').value.trim() || null,
        nip_kepala_sekolah: document.getElementById('psNipKepalaSekolah').value.trim() || null,
        kota_ttd: document.getElementById('psKotaTtd').value.trim() || 'Tambak',
        tanggal_rapor: document.getElementById('psTanggalRapor').value || null,
        tanggal_tengah_semester: document.getElementById('psTanggalTengahSemester').value || null,
        tanggal_pkl: document.getElementById('psTanggalPkl').value || null,
        ttd_kepala_sekolah: ttdDataUrl,
        tampil_ttd_rapor: document.getElementById('psTampilRapor').checked,
        tampil_ttd_tengah_semester: document.getElementById('psTampilTengahSemester').checked,
        tampil_ttd_pkl: document.getElementById('psTampilPkl').checked,
        updated_at: new Date().toISOString()
      }, { onConflict: 'singleton' });

      if (upd.error) {
        var salahKolom = /column|schema cache/i.test(upd.error.message || '');
        msg.textContent = 'Gagal menyimpan: ' + upd.error.message +
          (salahKolom ? ' — jalankan dulu migrasi_profil_sekolah_data_sekolah.sql di Supabase SQL Editor.' : '');
      } else {
        msg.textContent = 'Tersimpan.';
      }
    });
  }


  async function renderTahunAjaran() {
    content.innerHTML =
      '<div class="panel-head"><div><div class="panel-head__title">Tahun Ajaran</div>' +
      '<div class="panel-head__desc">Hanya satu tahun ajaran yang boleh aktif. Semua data guru & siswa mengikuti yang aktif di sini.</div></div></div>' +
      '<form class="add-form" id="formTA">' +
      '<div class="field"><label>Nama (contoh: 2026/2027)</label><input type="text" id="taNama" required></div>' +
      '<div class="field"><label>Semester</label><select id="taSemester"><option value="Gasal">Gasal</option><option value="Genap">Genap</option></select></div>' +
      '<button type="submit" class="btn-small btn-small--primary">Tambah</button>' +
      '</form>' +
      '<div class="table-wrap"><table class="data-table"><thead><tr><th>Nama</th><th>Semester</th><th>Status</th><th></th></tr></thead><tbody id="taBody"></tbody></table></div>' +
      '<div id="nkWrap"></div>';

    document.getElementById('formTA').addEventListener('submit', async function (e) {
      e.preventDefault();
      var nama = document.getElementById('taNama').value.trim();
      var semester = document.getElementById('taSemester').value;
      if (!nama) return;
      var res = await supabaseClient.from('tahun_ajaran').insert({ nama: nama, semester: semester });

    var rows = listRes.data || [];
    var body = document.getElementById('taBody');

    rows.forEach(function (r) {
      var tr = document.createElement('tr');
      tr.innerHTML =

    body.querySelectorAll('button[data-id]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        var res = await supabaseClient.from('tahun_ajaran').update({ is_aktif: true }).eq('id', btn.dataset.id);

        await muatTahunAktif();
        renderTahunAjaran();

    renderNaikKelasPanel(rows);

    // ---------- Modal Edit ----------
    function bukaModalTahunAjaran(existing) {
      var overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML =
        '<div class="modal-box">' +
        '<div class="modal-box__head"><div class="modal-box__title">Edit Tahun Ajaran</div>' +
        '<button type="button" class="modal-box__close" id="modalCloseBtn">×</button></div>' +
        '<form id="formModalTA">' +
        '<div class="form-grid">' +
        '<div class="field"><label>Nama</label><input type="text" id="f_taNama" value="' + escapeHtml(existing.nama) + '" required></div>' +
        '<div class="field"><label>Semester</label><select id="f_taSemester">' +
        '<option value="Gasal"' + (existing.semester === 'Gasal' ? ' selected' : '') + '>Gasal</option>' +
        '<option value="Genap"' + (existing.semester === 'Genap' ? ' selected' : '') + '>Genap</option>' +
        '</select></div>' +
        '</div>' +
        '<div class="modal-box__actions">' +
        '<button type="button" class="btn-small" id="modalCancelBtn">Batal</button>' +
        '<button type="submit" class="btn-small btn-small--primary">Simpan</button>' +
        '</div>' +
        '</form>' +
        '</div>';
      document.body.appendChild(overlay);

      function tutup() { overlay.remove(); }
      document.getElementById('modalCloseBtn').addEventListener('click', tutup);
      document.getElementById('modalCancelBtn').addEventListener('click', tutup);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) tutup(); });

      document.getElementById('formModalTA').addEventListener('submit', async function (e) {
        e.preventDefault();
        var nama = document.getElementById('f_taNama').value.trim();
        var semester = document.getElementById('f_taSemester').value;
        if (!nama) return;
        var res = await supabaseClient.from('tahun_ajaran').update({ nama: nama, semester: semester }).eq('id', existing.id);
        if (res.error) { alert('Gagal menyimpan: ' + res.error.message); return; }
        tutup();
        await muatTahunAktif();
        renderTahunAjaran();
      });

  // ================= NAIK KELAS & KELULUSAN =================
  // Dipanggil dari panel Tahun Ajaran. Memindahkan siswa AKTIF dari
  // tahun ajaran ASAL ke tahun ajaran TUJUAN:
  //   Tingkat 10 -> kelas Tingkat 11, Tingkat 11 -> kelas Tingkat 12,
  //   Tingkat 12 -> status siswa menjadi 'lulus'.
  // Yang dilakukan hanya INSERT ke siswa_kelas (baris tahun lama tidak
  // disentuh, jadi riwayat/leger aman) dan UPDATE siswa.status untuk
  // yang lulus. Siswa yang SUDAH punya penempatan di tahun tujuan
  // dilewati, jadi proses ini aman diulang.

  // "XI ANM 1" -> "ANM1": awalan tingkat & pemisah dibuang, huruf besar.
  // Dipakai untuk menebak pasangan kelas ("X ANM 1" <-> "XI ANM 1").
  function kunciNamaKelas(nama) {
    var s = String(nama || '').trim().toUpperCase();
    s = s.replace(/^(XII|XI|X|12|11|10)(?=[\s\-_.]|$)[\s\-_.]*/, '');
    return s.replace(/[\s\-_.]+/g, '');
  }

  function tebakKelasTujuan(kelasAsal, kandidat) {
    var kunci = kunciNamaKelas(kelasAsal.nama);
    var cocokNama = kandidat.filter(function (k) { return kunci && kunciNamaKelas(k.nama) === kunci; });
    if (cocokNama.length === 1) return cocokNama[0].id;

    var punyaProgram = !!(kelasAsal.program_keahlian || kelasAsal.konsentrasi_keahlian);
    if (!punyaProgram) return '';
    var cocokProgram = kandidat.filter(function (k) {
      return (k.program_keahlian || '') === (kelasAsal.program_keahlian || '') &&
        (k.konsentrasi_keahlian || '') === (kelasAsal.konsentrasi_keahlian || '');
    });
    return cocokProgram.length === 1 ? cocokProgram[0].id : '';
  }

  function renderNaikKelasPanel(semuaTA) {
    var wrap = document.getElementById('nkWrap');
    if (!wrap) return;

    var headHtml =
      '<div class="panel-head" style="margin-top:32px;"><div><div class="panel-head__title">Naik Kelas &amp; Kelulusan</div>' +
      '<div class="panel-head__desc">Dipakai saat pergantian tahun ajaran: siswa Tingkat 10 naik ke Tingkat 11, Tingkat 11 naik ke Tingkat 12, dan siswa Tingkat 12 dinyatakan lulus. ' +
      'Data tahun ajaran lama tidak diubah atau dihapus.</div></div></div>';

    if (semuaTA.length < 2) {
      wrap.innerHTML = headHtml + '<div class="panel-note">Buat dulu tahun ajaran tujuan (mis. 2027/2028 Gasal) lewat form di atas, lalu proses kenaikan kelas dari sini.</div>';
      return;
    }

    var asalDefault = semuaTA.filter(function (t) { return t.is_aktif; })[0] || semuaTA[0];

        return a.semester === 'Gasal' ? -1 : 1;
      });
    var tujuanDefault = kandidatTujuan.length ? kandidatTujuan[0].id : '';

    function opsiTA(selectedId, placeholder) {
      return (placeholder ? '<option value="">' + placeholder + '</option>' : '') + semuaTA.map(function (t) {
        return '<option value="' + t.id + '"' + (t.id === selectedId ? ' selected' : '') + '>' +
          escapeHtml(t.nama + ' — ' + t.semester + (t.is_aktif ? ' (aktif)' : '')) + '</option>';
      }).join('');

    wrap.innerHTML = headHtml +
      '<form class="add-form" id="formNK">' +

      '<div class="field"><label>Ke tahun ajaran</label><select id="nkTujuan">' + opsiTA(tujuanDefault, '— pilih —') + '</select></div>' +
      '<button type="submit" class="btn-small btn-small--primary">Lihat Pratinjau</button>' +
      '</form>' +

    document.getElementById('formNK').addEventListener('submit', function (e) {

  async function muatPratinjauNaikKelas(asal, tujuan) {
    var box = document.getElementById('nkPreview');
    box.innerHTML = '<div class="panel-note">Memuat data siswa...</div>';

    var kelasList, skAsal, skTujuan;
    try {
      var kelasRes = await supabaseClient.from('kelas')
        .select('id, nama, tingkat, program_keahlian, konsentrasi_keahlian').order('tingkat').order('nama');
      if (kelasRes.error) throw kelasRes.error;
      kelasList = kelasRes.data || [];

      skAsal = await ambilSemuaBaris(function () {
        return supabaseClient.from('siswa_kelas')
          .select('id, siswa_id, kelas_id, siswa:siswa_id(id, nama, nis, status)')
          .eq('tahun_ajaran_id', asal.id).order('id');
      });
      skTujuan = await ambilSemuaBaris(function () {
        return supabaseClient.from('siswa_kelas').select('id, siswa_id')
          .eq('tahun_ajaran_id', tujuan.id).order('id');
      });
    } catch (err) {
      box.innerHTML = '<div class="panel-note">Gagal memuat data: ' + escapeHtml(err.message || err) + '</div>';
      return;
    }

    var sudahDiTujuan = {};
    skTujuan.forEach(function (r) { sudahDiTujuan[r.siswa_id] = true; });
    var kelasMap = {};
    kelasList.forEach(function (k) { kelasMap[k.id] = k; });

    // Kelompokkan siswa AKTIF per kelas asal. Siswa berstatus lulus/pindah/
    // keluar tidak ikut diproses.
    var kelompok = {};
    var jumlahNonAktif = 0;
    skAsal.forEach(function (r) {
      var k = kelasMap[r.kelas_id];
      var s = r.siswa;
      if (!k || !s) return;
      if (s.status !== 'aktif') { jumlahNonAktif++; return; }
      if (!kelompok[k.id]) kelompok[k.id] = { kelas: k, siswa: [] };
      kelompok[k.id].siswa.push({ id: s.id, nama: s.nama || '', nis: s.nis, sudah: !!sudahDiTujuan[s.id] });
    });
    var daftar = Object.keys(kelompok).map(function (id) { return kelompok[id]; }).sort(function (a, b) {
      if (a.kelas.tingkat !== b.kelas.tingkat) return a.kelas.tingkat - b.kelas.tingkat;
      return a.kelas.nama.localeCompare(b.kelas.nama, 'id', { numeric: true });
    });
    daftar.forEach(function (g) { g.siswa.sort(function (a, b) { return a.nama.localeCompare(b.nama); }); });

    if (!daftar.length) {
      box.innerHTML = '<div class="panel-note">Tidak ada siswa aktif yang tercatat di kelas pada tahun ajaran ' +
        escapeHtml(asal.nama + ' ' + asal.semester) + '.</div>';
      return;
    }

    // Peringatan kalau kombinasi tahun ajaran tidak lazim.
    var peringatan = [];
    if (asal.semester !== 'Genap' || tujuan.semester !== 'Gasal') {
      peringatan.push('Kenaikan kelas biasanya dilakukan dari semester Genap ke semester Gasal tahun ajaran berikutnya. ' +
        'Kamu memilih ' + asal.nama + ' ' + asal.semester + ' → ' + tujuan.nama + ' ' + tujuan.semester + '.');
    }
    var thAsal = parseInt(String(asal.nama).slice(0, 4), 10);
    var thTujuan = parseInt(String(tujuan.nama).slice(0, 4), 10);
    if (!isNaN(thAsal) && !isNaN(thTujuan) && thTujuan !== thAsal + 1) {
      peringatan.push('Tahun ajaran tujuan (' + tujuan.nama + ') bukan tahun berikutnya dari tahun ajaran asal (' + asal.nama + ').');
    }

    var barisHtml = daftar.map(function (g) {
      var tingkat = g.kelas.tingkat;
      var jumlahSudah = g.siswa.filter(function (s) { return s.sudah; }).length;

      var aksiHtml;
      if (tingkat >= 12) {
        aksiHtml = '<span class="chip chip--aktif">Lulus</span>';
      } else {
        var kandidat = kelasList.filter(function (k) { return k.tingkat === tingkat + 1; });
        if (!kandidat.length) {
          aksiHtml = '<span class="chip chip--danger">Belum ada kelas Tingkat ' + (tingkat + 1) + '</span>';
        } else {
          var tebakan = tebakKelasTujuan(g.kelas, kandidat);
          aksiHtml = '<select data-nk-kelas="' + g.kelas.id + '">' +
            '<option value="">— pilih kelas tujuan (kosong = lewati) —</option>' +
            kandidat.map(function (k) {
              return '<option value="' + k.id + '"' + (k.id === tebakan ? ' selected' : '') + '>' + escapeHtml(k.nama) + '</option>';
            }).join('') + '</select>';
        }
      }

      var siswaHtml = g.siswa.map(function (s) {
        return '<label style="display:block;font-size:13px;padding:2px 0;">' +
          '<input type="checkbox" class="nkTidak" value="' + s.id + '"' + (s.sudah ? ' disabled' : '') + '> ' +
          escapeHtml(s.nama) + (s.nis ? ' <span style="color:#888;">(' + escapeHtml(s.nis) + ')</span>' : '') +
          (s.sudah ? ' <span style="color:#b45309;">— sudah punya kelas di tahun tujuan, dilewati</span>' : '') +
          '</label>';
      }).join('');

      return '<tr>' +
        '<td><strong>' + escapeHtml(g.kelas.nama) + '</strong>' +
        '<details style="margin-top:6px;"><summary style="cursor:pointer;font-size:12px;color:#555;">Ada yang tidak naik / tidak lulus? Ceklis di sini</summary>' +
        '<div style="margin-top:6px;max-height:220px;overflow:auto;">' + siswaHtml + '</div></details></td>' +
        '<td>' + escapeHtml(tingkat) + '</td>' +
        '<td>' + g.siswa.length + (jumlahSudah ? ' <span style="color:#b45309;font-size:12px;">(' + jumlahSudah + ' sudah ada)</span>' : '') + '</td>' +
        '<td>' + aksiHtml + '</td>' +
        '</tr>';
    }).join('');

    box.innerHTML =
      (peringatan.length
        ? '<div class="panel-note" style="border-left:4px solid var(--danger);"><strong>Periksa dulu:</strong><br>' +
          peringatan.map(escapeHtml).join('<br>') + '</div>'
        : '') +
      '<div class="panel-note">Pratinjau: <strong>' + escapeHtml(asal.nama + ' ' + asal.semester) + '</strong> → <strong>' +
      escapeHtml(tujuan.nama + ' ' + tujuan.semester) + '</strong>. ' +
      'Tingkat 12 akan berstatus <em>lulus</em>. ' +
      (jumlahNonAktif ? jumlahNonAktif + ' siswa berstatus non-aktif (lulus/pindah/keluar) tidak ikut diproses. ' : '') +
      'Kelas tujuan sudah ditebak dari nama kelas — periksa dan ubah kalau perlu.</div>' +
      '<div class="table-wrap"><table class="data-table"><thead><tr><th>Kelas Asal</th><th>Tingkat</th><th>Siswa</th><th>Kelas Tujuan</th></tr></thead>' +
      '<tbody>' + barisHtml + '</tbody></table></div>' +
      '<div class="toolbar"><button class="btn-small btn-small--primary" id="nkProses">Proses Naik Kelas &amp; Kelulusan</button></div>' +
      '<div id="nkHasil"></div>';

    document.getElementById('nkProses').addEventListener('click', async function () {
      var btn = this;
      var hasilBox = document.getElementById('nkHasil');

      var tidakSet = {};
      box.querySelectorAll('.nkTidak:checked').forEach(function (c) { tidakSet[c.value] = true; });

      var barisSiswaKelas = [];
      var idLulus = [];
      var kelasDilewati = [];
      daftar.forEach(function (g) {
        var ikut = g.siswa.filter(function (s) { return !s.sudah && !tidakSet[s.id]; });
        if (!ikut.length) return;
        if (g.kelas.tingkat >= 12) {
          ikut.forEach(function (s) { idLulus.push(s.id); });
          return;
        }
        var sel = box.querySelector('select[data-nk-kelas="' + g.kelas.id + '"]');
        var kelasTujuanId = sel ? sel.value : '';
        if (!kelasTujuanId) {
          kelasDilewati.push(g.kelas.nama + ' (' + ikut.length + ' siswa)');
          return;
        }
        ikut.forEach(function (s) {
          barisSiswaKelas.push({ siswa_id: s.id, kelas_id: kelasTujuanId, tahun_ajaran_id: tujuan.id });
        });
      });

      if (!barisSiswaKelas.length && !idLulus.length) {
        hasilBox.innerHTML = '<div class="panel-note">Tidak ada siswa yang bisa diproses. Pilih kelas tujuan dulu.</div>';
        return;
      }

      var pesan = 'Proses ' + asal.nama + ' ' + asal.semester + ' → ' + tujuan.nama + ' ' + tujuan.semester + ':\n\n' +
        '• ' + barisSiswaKelas.length + ' siswa dinaikkan kelas\n' +
        '• ' + idLulus.length + ' siswa Tingkat 12 dinyatakan LULUS\n' +
        (kelasDilewati.length ? '• Dilewati (kelas tujuan belum dipilih): ' + kelasDilewati.join(', ') + '\n' : '') +
        (peringatan.length ? '\nPERHATIAN:\n' + peringatan.join('\n') + '\n' : '') +
        '\nLanjutkan?';
      if (!confirm(pesan)) return;

      btn.disabled = true;
      btn.textContent = 'Memproses...';

      var errorList = [];
      var berhasilNaik = 0;
      var berhasilLulus = 0;

      for (var i = 0; i < barisSiswaKelas.length; i += 500) {
        var batch = barisSiswaKelas.slice(i, i + 500);
        var r1 = await supabaseClient.from('siswa_kelas')
          .upsert(batch, { onConflict: 'siswa_id,tahun_ajaran_id', ignoreDuplicates: true });
        if (r1.error) { errorList.push('Penempatan kelas: ' + r1.error.message); break; }
        berhasilNaik += batch.length;
      }

      for (var j = 0; j < idLulus.length; j += 100) {
        var batchId = idLulus.slice(j, j + 100);
        var r2 = await supabaseClient.from('siswa').update({ status: 'lulus' }).in('id', batchId);
        if (r2.error) { errorList.push('Status lulus: ' + r2.error.message); break; }
        berhasilLulus += batchId.length;
      }

      btn.disabled = false;
      btn.textContent = 'Proses Naik Kelas & Kelulusan';

      hasilBox.innerHTML =
        '<div class="panel-note">' +
        (errorList.length ? '<strong>Selesai dengan kendala:</strong><br>' + errorList.map(escapeHtml).join('<br>') + '<br><br>' : '<strong>Selesai.</strong> ') +
        berhasilNaik + ' siswa dinaikkan kelas, ' + berhasilLulus + ' siswa dinyatakan lulus.' +
        (kelasDilewati.length ? '<br>Belum diproses (kelas tujuan kosong): ' + escapeHtml(kelasDilewati.join(', ')) + '.' : '') +
        '<br><br>Langkah berikutnya: aktifkan tahun ajaran ' + escapeHtml(tujuan.nama + ' ' + tujuan.semester) +
        ' di tabel atas, lalu isi menu Intrakurikuler (penugasan mapel) dan Wali Kelas di aplikasi E-Rapor untuk tahun ajaran itu. ' +
        'Siswa yang tinggal kelas bisa ditempatkan manual lewat menu Siswa di E-Rapor.' +
        '</div>';
    });
  }


  // Supabase membatasi 1000 baris per permintaan, jadi diambil bertahap.
  async function ambilSemuaBaris(buatQuery) {
    var hasil = [];
    var ukuran = 1000;
    for (var dari = 0; ; dari += ukuran) {
      var r = await buatQuery().range(dari, dari + ukuran - 1);
      if (r.error) throw r.error;
      var data = r.data || [];
      hasil = hasil.concat(data);
      if (data.length < ukuran) break;
    }
    return hasil;
  }


  // ================= Slideshow Login =================
  // Kumpulan gambar yang tampil bergantian (slideshow) di panel kiri
  // halaman Masuk (index.html), sebelum user login. Disimpan di tabel
  // public.login_slideshow, tiap baris 1 gambar (data URL base64,
  // sama seperti tanda tangan Kepala Sekolah — tidak perlu Supabase
  // Storage terpisah) + kolom `urutan` untuk mengatur giliran tampil.
  // Tabel ini boleh dibaca siapa saja (termasuk yang belum login,
  // lewat anon key) supaya slideshow bisa muncul di halaman Masuk,
  // tapi cuma admin yang boleh menambah/mengurutkan/menghapus.
  async function renderSlideshowLogin() {
    content.innerHTML = '<div class="panel-head"><div><div class="panel-head__title">Slideshow Login</div>' +
      '<div class="panel-head__desc">Memuat daftar gambar...</div></div></div>';

    // Gambar yang baru dipilih (sudah dikecilkan jadi data URL), belum
    // disimpan ke database sampai tombol "Tambah ke Slideshow" diklik
    // — supaya Judul & Deskripsi bisa diisi dulu sebelum tersimpan.
    var calonGambarBaru = null; // { blob, preview } — sudah dikompres <= 80 KB, belum diunggah

    // Gambar disimpan di Supabase Storage (bucket publik "login-slideshow",
    // karena harus tampil sebelum login). Kolom `gambar` hanya berisi PATH file.
    // Nilai lama berupa data URL (base64) tetap tampil sampai dimigrasi.
    var BUCKET_SLIDE = 'login-slideshow';
    function urlSlide(v) {
      if (!v) return '';
      if (/^(data:|https?:)/.test(v)) return v;
      return supabaseClient.storage.from(BUCKET_SLIDE).getPublicUrl(v).data.publicUrl;
    }

    async function muatDanGambar() {
      var res = await supabaseClient.from('login_slideshow').select('*').order('urutan', { ascending: true });
      var list = res.data || [];

      var listHtml = !list.length
        ? '<div class="panel-note">Belum ada gambar. Tambahkan gambar lewat form di bawah supaya slideshow muncul di halaman Masuk. Kalau kosong, halaman Masuk tampil seperti biasa (tanpa slideshow).</div>'
        : '<div id="slideshowList" style="display:flex;flex-direction:column;gap:10px;max-width:720px;">' +
          list.map(function (s, i) {
            return '<div class="slideshow-item" style="display:flex;gap:12px;border:1px solid var(--border,#e5e7eb);border-radius:8px;padding:10px;">' +
              '<img src="' + urlSlide(s.gambar) + '" alt="" style="width:128px;height:72px;object-fit:cover;border-radius:6px;flex-shrink:0;">' +
              '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;">' +
                '<div style="font-size:11.5px;color:var(--ink-soft);">Urutan ke-' + (i + 1) + '</div>' +
                '<input type="text" class="slide-judul" data-id="' + s.id + '" value="' + escapeHtml(s.judul || '') + '" placeholder="Judul (opsional)" style="font-weight:600;">' +
                '<textarea class="slide-deskripsi" data-id="' + s.id + '" rows="2" placeholder="Deskripsi (opsional)" style="font-size:12.5px;resize:vertical;">' + escapeHtml(s.deskripsi || '') + '</textarea>' +
                '<div>' +
                  '<button type="button" class="btn-small btn-small--primary btn-slide-simpan-teks" data-id="' + s.id + '">Simpan Teks</button>' +
                '</div>' +
              '</div>' +
              '<div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0;">' +
                '<button type="button" class="btn-small btn-slide-naik" data-id="' + s.id + '"' + (i === 0 ? ' disabled' : '') + ' title="Pindah ke atas"><i data-lucide="chevron-up" style="width:14px;height:14px;"></i></button>' +
                '<button type="button" class="btn-small btn-slide-turun" data-id="' + s.id + '"' + (i === list.length - 1 ? ' disabled' : '') + ' title="Pindah ke bawah"><i data-lucide="chevron-down" style="width:14px;height:14px;"></i></button>' +
                '<button type="button" class="btn-small btn-slide-hapus" data-id="' + s.id + '" title="Hapus"><i data-lucide="trash-2" style="width:14px;height:14px;"></i></button>' +
              '</div>' +
              '</div>';
          }).join('') +
          '</div>';

      content.innerHTML =
        '<div class="panel-head"><div><div class="panel-head__title">Slideshow Login</div>' +
        '<div class="panel-head__desc">Gambar-gambar ini tampil bergantian (auto-geser) di panel kiri halaman Masuk, sebagai galeri/promosi sekolah, lengkap dengan Judul &amp; Deskripsi kalau diisi. Urutan tampil bisa diatur lewat tombol naik/turun.</div></div></div>' +
        listHtml +
        '<div class="add-form" style="flex-direction:column;align-items:stretch;max-width:520px;margin-top:16px;border:1px dashed var(--border-strong,#cbd5e1);border-radius:10px;padding:14px;">' +
          '<div style="font-weight:600;font-size:13px;margin-bottom:10px;">Tambah Gambar Baru</div>' +
          '<div class="field"><label>Gambar (orientasi landscape/mendatar dianjurkan)</label><input type="file" id="slideshowFile" accept="image/png,image/jpeg,image/webp"></div>' +
          '<div id="slideshowNewPreviewWrap"></div>' +
          '<div class="field"><label>Judul (opsional)</label><input type="text" id="slideshowNewJudul" placeholder="mis. Prestasi Siswa 2026"></div>' +
          '<div class="field"><label>Deskripsi (opsional)</label><textarea id="slideshowNewDeskripsi" rows="2" placeholder="mis. Juara 1 LKS Tingkat Provinsi"></textarea></div>' +
          '<button type="button" class="btn-small btn-small--primary" id="slideshowNewSubmit" disabled style="align-self:flex-start;"><i data-lucide="upload" style="width:14px;height:14px;"></i> Tambah ke Slideshow</button>' +
          '<div class="panel-note" style="margin:8px 0 0;padding:0;">Gunakan foto berorientasi landscape/mendatar (mis. 16:9) untuk hasil terbaik. Gambar otomatis dikompres menjadi ≤ 80 KB dan disimpan di Supabase Storage.</div>' +
        '</div>' +
        (list.some(function (s) { return /^data:/.test(s.gambar || ''); })
          ? '<div class="panel-note" style="margin-top:14px;">Ada gambar lama yang masih tersimpan di database. <button type="button" class="btn-small" id="slideshowMigrasi">Pindahkan ke Storage</button></div>'
          : '') +
        '<div id="slideshowMsg" style="margin-top:10px;"></div>';

      lucide.createIcons();
      var bMigrasi = document.getElementById('slideshowMigrasi');
      if (bMigrasi) bMigrasi.addEventListener('click', async function () {
        if (!confirm('Pindahkan semua gambar lama ke Storage dan kompres ke ≤ 80 KB?')) return;

        await migrasiSlideshowKeStorage();
      });

      document.querySelectorAll('.btn-slide-naik').forEach(function (btn) {
        btn.addEventListener('click', function () { tukarUrutan(btn.dataset.id, -1, list); });
      });
      document.querySelectorAll('.btn-slide-turun').forEach(function (btn) {
        btn.addEventListener('click', function () { tukarUrutan(btn.dataset.id, 1, list); });
      });
      document.querySelectorAll('.btn-slide-hapus').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          if (!confirm('Hapus gambar ini dari slideshow?')) return;
          var msg = document.getElementById('slideshowMsg');
          msg.textContent = 'Menghapus...';
          var baris = list.find(function (x) { return x.id === btn.dataset.id; });
          var del = await supabaseClient.from('login_slideshow').delete().eq('id', btn.dataset.id);
          if (del.error) { msg.textContent = 'Gagal menghapus: ' + del.error.message; return; }
          if (baris && baris.gambar && !/^(data:|https?:)/.test(baris.gambar)) {
            try { await supabaseClient.storage.from(BUCKET_SLIDE).remove([baris.gambar]); } catch (e) { /* file yatim tidak fatal */ }
          }
          muatDanGambar();
        });
      });
      document.querySelectorAll('.btn-slide-simpan-teks').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          var msg = document.getElementById('slideshowMsg');
          msg.textContent = 'Menyimpan teks...';
          var id = btn.dataset.id;
          var judul = document.querySelector('.slide-judul[data-id="' + id + '"]').value.trim() || null;
          var deskripsi = document.querySelector('.slide-deskripsi[data-id="' + id + '"]').value.trim() || null;
          var upd = await supabaseClient.from('login_slideshow').update({ judul: judul, deskripsi: deskripsi }).eq('id', id);
          msg.textContent = upd.error ? ('Gagal menyimpan: ' + upd.error.message) : 'Teks tersimpan.';
        });
      });

      document.getElementById('slideshowFile').addEventListener('change', async function (e) {
        var file = e.target.files && e.target.files[0];
        var submitBtn = document.getElementById('slideshowNewSubmit');
        var previewWrap = document.getElementById('slideshowNewPreviewWrap');
        var msg = document.getElementById('slideshowMsg');
        calonGambarBaru = null;
        submitBtn.disabled = true;
        previewWrap.innerHTML = '';
        if (!file) return;
        try {
          msg.textContent = 'Memproses gambar...';
          var blobKecil = await kecilkanGambarSlideshow(file);
          calonGambarBaru = { blob: blobKecil, preview: URL.createObjectURL(blobKecil) };
          previewWrap.innerHTML = '<img src="' + calonGambarBaru.preview + '" alt="" style="width:100%;max-width:300px;border-radius:8px;margin:4px 0 2px;display:block;">';
          submitBtn.disabled = false;
          msg.textContent = 'Gambar siap (' + Math.round(blobKecil.size / 1024) + ' KB) — isi Judul/Deskripsi (opsional), lalu klik "Tambah ke Slideshow".';
        } catch (err) {
          msg.textContent = 'Gagal memproses gambar: ' + (err && err.message ? err.message : err);
        }
      });

      document.getElementById('slideshowNewSubmit').addEventListener('click', async function () {
        var msg = document.getElementById('slideshowMsg');
        if (!calonGambarBaru) { msg.textContent = 'Pilih gambar dulu.'; return; }
        msg.textContent = 'Menyimpan...';
        var judul = document.getElementById('slideshowNewJudul').value.trim() || null;
        var deskripsi = document.getElementById('slideshowNewDeskripsi').value.trim() || null;
        var urutanBaru = list.length ? (Math.max.apply(null, list.map(function (s) { return s.urutan; })) + 1) : 0;
        var path = 'slide-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
        var up = await supabaseClient.storage.from(BUCKET_SLIDE).upload(path, calonGambarBaru.blob, { contentType: 'image/jpeg', cacheControl: '31536000', upsert: false });
        if (up.error) { msg.textContent = 'Gagal mengunggah gambar: ' + up.error.message + ' (pastikan migrasi_slideshow_storage.sql sudah dijalankan)'; return; }
        var ins = await supabaseClient.from('login_slideshow').insert({ gambar: path, judul: judul, deskripsi: deskripsi, urutan: urutanBaru });
        if (ins.error) {
          try { await supabaseClient.storage.from(BUCKET_SLIDE).remove([path]); } catch (e) { /* abaikan */ }
          msg.textContent = 'Gagal menyimpan: ' + ins.error.message; return;
        }
        calonGambarBaru = null;
        muatDanGambar();
      });
    }

    // Tukar nilai `urutan` gambar ini dengan tetangganya (arah -1 = naik,
    // +1 = turun), lalu simpan keduanya. Konsep sama seperti geser baris
    // di menu lain yang punya urutan manual (mis. Urutan Mapel Leger).
    async function tukarUrutan(id, arah, list) {
      var idx = list.findIndex(function (s) { return s.id === id; });
      var idxLawan = idx + arah;
      if (idx < 0 || idxLawan < 0 || idxLawan >= list.length) return;
      var a = list[idx], b = list[idxLawan];
      var msg = document.getElementById('slideshowMsg');
      msg.textContent = 'Menyimpan urutan...';
      var hasil = await Promise.all([
        supabaseClient.from('login_slideshow').update({ urutan: b.urutan }).eq('id', a.id),
        supabaseClient.from('login_slideshow').update({ urutan: a.urutan }).eq('id', b.id)
      ]);
      if (hasil[0].error || hasil[1].error) {
        msg.textContent = 'Gagal menyimpan urutan: ' + (hasil[0].error || hasil[1].error).message;
        return;
      }
      muatDanGambar();
    }

    // Mengompres gambar slideshow di browser menjadi JPEG <= 80 KB.
    // Mulai dari lebar maks 1280 px; kualitas dicari dengan pencarian biner,
    // bila masih > 80 KB dimensi diperkecil 15% lalu diulang.
    var SLIDE_MAKS_BYTE = 80 * 1024;
    function canvasKeBlobSlide(c, q) { return new Promise(function (res) { c.toBlob(res, 'image/jpeg', q); }); }
    async function kecilkanGambarSlideshow(file) {
      if (!file || !/^image\//.test(file.type || '')) throw new Error('File bukan gambar. Pilih JPG, PNG, atau WEBP.');
      var url = URL.createObjectURL(file);
      try {
        var img = await new Promise(function (resolve, reject) {
          var im = new Image();
          im.onload = function () { resolve(im); };
          im.onerror = function () { reject(new Error('File bukan gambar yang valid.')); };
          im.src = url;
        });
        var skala = Math.min(1, 1280 / img.naturalWidth, 1280 / img.naturalHeight);
        var w = Math.max(1, Math.round(img.naturalWidth * skala));
        var h = Math.max(1, Math.round(img.naturalHeight * skala));
        for (var tahap = 0; tahap < 10; tahap++) {
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          var ctx = c.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          var b = await canvasKeBlobSlide(c, 0.85);
          if (b && b.size <= SLIDE_MAKS_BYTE) return b;
          var lo = 0.3, hi = 0.85, terbaik = null;
          for (var i = 0; i < 7; i++) {
            var mid = (lo + hi) / 2;
            b = await canvasKeBlobSlide(c, mid);
            if (b && b.size <= SLIDE_MAKS_BYTE) { terbaik = b; lo = mid; } else { hi = mid; }
          }
          if (terbaik) return terbaik;
          w = Math.max(1, Math.round(w * 0.85)); h = Math.max(1, Math.round(h * 0.85));
        }
        throw new Error('Gambar tidak bisa dikompres sampai 80 KB. Coba gambar lain.');
      } finally { URL.revokeObjectURL(url); }
    }

    // Pindahkan gambar lama (base64 di database) ke Storage.
    async function migrasiSlideshowKeStorage() {
      var msg = document.getElementById('slideshowMsg');
      var r = await supabaseClient.from('login_slideshow').select('id, gambar').like('gambar', 'data:%');
      if (r.error) { msg.textContent = 'Gagal membaca data: ' + r.error.message; return; }
      var rows = r.data || [], ok = 0, gagal = 0;
      for (var i = 0; i < rows.length; i++) {
        msg.textContent = 'Memindahkan ' + (i + 1) + ' / ' + rows.length + '...';
        try {
          var blob = await (await fetch(rows[i].gambar)).blob();
          var kecil = await kecilkanGambarSlideshow(new File([blob], 'x.jpg', { type: blob.type || 'image/jpeg' }));
          var path = 'slide-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
          var up = await supabaseClient.storage.from(BUCKET_SLIDE).upload(path, kecil, { contentType: 'image/jpeg', cacheControl: '31536000', upsert: false });
          if (up.error) throw up.error;
          var u = await supabaseClient.from('login_slideshow').update({ gambar: path }).eq('id', rows[i].id);
          if (u.error) { try { await supabaseClient.storage.from(BUCKET_SLIDE).remove([path]); } catch (e2) {} throw u.error; }
          ok++;
        } catch (e) { gagal++; }
      }
      try { localStorage.removeItem('login_slideshow_cache_v1'); } catch (e) {}
      msg.textContent = 'Selesai: ' + ok + ' gambar dipindah, ' + gagal + ' gagal.';
      muatDanGambar();
    }

    await muatDanGambar();
  }


  var views = { profilSekolah: renderProfilSekolah, tahunAjaran: renderTahunAjaran, slideshowLogin: renderSlideshowLogin };

  function bukaView(nama) {
    if (!views[nama]) nama = 'profilSekolah';
    setActiveMenu(nama);
    views[nama]();
  }

  document.querySelectorAll('#menuAdmin .menu-item').forEach(function (item) {
    item.addEventListener('click', function (e) {
      e.preventDefault();
      var v = item.dataset.view;
      try { history.replaceState(null, '', '#' + v); } catch (err) {}
      bukaView(v);
    });
  });

  (async function () {
    // 1. Cek sesi login
    var sessionResult = await supabaseClient.auth.getSession();
    var session = sessionResult.data.session;
    if (!session) { window.location.href = 'index.html'; return; }
    var user = session.user;

    // 2. Hanya admin
    var profileResult = await supabaseClient.from('profiles').select('nama, role').eq('id', user.id).single();
    if (profileResult.error || !profileResult.data) { window.location.href = 'portal.html'; return; }
    if (profileResult.data.role !== 'admin') { window.location.href = 'portal.html'; return; }

    var nama = profileResult.data.nama || user.email;
    document.getElementById('userName').textContent = nama;
    document.getElementById('userAvatar').textContent = nama.trim().charAt(0).toUpperCase();

    // 3. Tahun ajaran aktif + buka menu sesuai #hash (default: Profil Sekolah)
    await muatTahunAktif();
    bukaView((location.hash || '').replace('#', ''));
  })();

  document.getElementById('logoutBtn').addEventListener('click', async function (e) {
    e.preventDefault();
    await catatAktivitas('logout', 'Akun', 'Keluar dari aplikasi');
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  });
</script>
