<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Aktivitas (Admin) — PORTAL DATA DAN PENILAIAN SMK WIDYA MANDALA TAMBAK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=11">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="mobile.js?v=1" defer></script>
<script src="foto-profil.js?v=3" defer></script>
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar__brand">
      <img class="sidebar__brand-logo" src="assets/logo.png" alt="Logo SMK Widya Mandala Tambak">
      <div class="sidebar__brand-text">
        <span class="sidebar__brand-mark">Log Aktivitas</span>
        <span class="sidebar__brand-school">SMK Widya Mandala Tambak</span>
      </div>
    </div>
    <div class="sidebar__role"><i data-lucide="shield-check" style="width:13px;height:13px;"></i> Admin Log Aktivitas</div>

    <nav class="menu-list" id="menuAdmin">
      <a href="#semua" class="menu-item" data-view="semua"><i data-lucide="history" class="menu-icon"></i><span class="menu-item__title">Semua Aktivitas</span></a>
      <div class="sidebar__section-label">Per Aplikasi</div>
      <a href="#erapor" class="menu-item" data-view="erapor"><i data-lucide="file-text" class="menu-icon"></i><span class="menu-item__title">E-Rapor</span></a>
      <a href="#bukuinduk" class="menu-item" data-view="bukuinduk"><i data-lucide="book-user" class="menu-icon"></i><span class="menu-item__title">Buku Induk</span></a>
      <a href="#pkl" class="menu-item" data-view="pkl"><i data-lucide="briefcase-business" class="menu-icon"></i><span class="menu-item__title">PKL</span></a>
      <a href="#supervisi" class="menu-item" data-view="supervisi"><i data-lucide="clipboard-check" class="menu-icon"></i><span class="menu-item__title">Supervisi</span></a>
      <a href="#pengaturan" class="menu-item" data-view="pengaturan"><i data-lucide="settings" class="menu-icon"></i><span class="menu-item__title">Pengaturan Sekolah</span></a>
      <a href="#akun" class="menu-item" data-view="akun"><i data-lucide="log-in" class="menu-icon"></i><span class="menu-item__title">Login &amp; Akun</span></a>
    </nav>

    <div class="sidebar__footer">
      <div style="margin-bottom:8px; opacity:0.8;">SMK Widya Mandala Tambak · Banyumas</div>
      <div style="margin-top:8px;font-size:10px;opacity:0.45;">developed by Hanif Shohibul A.</div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar__title">Log Aktivitas</div>
        <div class="topbar__row"><div class="topbar__meta" id="topbarMeta">Siapa melakukan apa dan kapan</div><a href="portal.html" class="btn-small topbar__app"><i data-lucide="layout-grid" style="width:14px;height:14px;"></i> Menu Utama</a></div>
      </div>
      <div class="user-chip">
        <div class="user-chip__text">
          <div class="user-chip__name" id="userName">Memuat...</div>
          <div class="user-chip__role">Admin</div>
          <a href="#" id="logoutBtn" class="user-chip__logout"><i data-lucide="log-out" style="width:13px;height:13px;"></i> Keluar</a>
        </div>
        <div class="user-chip__avatar" id="userAvatar">•</div>
      </div>
    </div>

    <div class="content" id="content"></div>
  </div>

</div>

<script>
  lucide.createIcons();

  var content = document.getElementById('content');

  function escapeHtml(s) {
    return (s === null || s === undefined) ? '' : String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function setActiveMenu(view) {
    document.querySelectorAll('#menuAdmin .menu-item').forEach(function (m) {
      m.classList.toggle('menu-item--active', m.dataset.view === view);
    });
  }

  // =========================================================
  // LOG AKTIVITAS
  // Menampilkan siapa melakukan apa dan kapan. Data dicatat otomatis
  // oleh trigger database + catatAktivitas() (login/logout/cetak/unduh).
  // Perlu migrasi_log_aktivitas.sql. Hanya admin yang bisa membaca.
  // =========================================================
  async function renderLogAktivitas(preset) {
    preset = preset || {};
    var UKURAN = 50;
    var halaman = 0;
    var totalBaris = 0;
    var rowsSekarang = [];

    content.innerHTML =
      '<div class="panel-head"><div><div class="panel-head__title">' + escapeHtml(preset.judul || 'Log Aktivitas') + '</div>' +
      '<div class="panel-head__desc">Riwayat siapa melakukan apa dan kapan di E-Rapor, Buku Induk, PKL, dan aplikasi lainnya: login, perubahan data, cetak, dan unduh. ' +
      'Perubahan beruntun oleh pengguna yang sama dalam 2 menit digabung jadi satu baris.</div></div></div>' +
      '<div class="panel-note" id="lgNote" style="margin-bottom:12px;">Memuat...</div>';

    // Daftar akun guru/admin untuk filter pengguna.
    var pr = await supabaseClient.from('profiles').select('id, nama, role').order('nama');
    var akun = pr.data || [];
    var opsiAkun = '<option value="">Semua pengguna</option>' + akun.map(function (a) {
      return '<option value="' + a.id + '">' + escapeHtml(a.nama || '(tanpa nama)') + ' (' + escapeHtml(a.role) + ')</option>';
    }).join('');

    var APLIKASI = ['E-Rapor', 'Buku Induk', 'PKL', 'Supervisi', 'Pengaturan Sekolah', 'Pelanggaran', 'Portal Siswa', 'Akun'];
    var opsiApp = '<option value="">Semua aplikasi</option>' + APLIKASI.map(function (m) {
      return '<option value="' + escapeHtml(m) + '"' + (preset.aplikasi === m ? ' selected' : '') + '>' + escapeHtml(m) + '</option>';
    }).join('');
    var daftarModul = ['Akun', 'Nilai Rapor', 'Nilai Tujuan Pembelajaran', 'Nilai Tengah Semester', 'Nilai Kokurikuler', 'Nilai Ekstrakurikuler', 'Nilai PKL',
      'Presensi & Catatan Wali', 'Tujuan Pembelajaran', 'Data Siswa', 'Penempatan Kelas Siswa', 'Data Kelas', 'Mata Pelajaran', 'Penugasan Mengajar', 'Wali Kelas',
      'PJ Kokurikuler', 'Data Ekstrakurikuler', 'Anggota Ekstrakurikuler', 'Tahun Ajaran', 'Profil Sekolah', 'Terbit Rapor', 'Akun Guru/Admin',
      'Pembimbing PKL', 'Penguji PKL', 'Biodata Tambahan Siswa', 'Arsip Nilai Semester', 'Catatan Siswa (Prestasi, dll)', 'Pengajuan Data Siswa',
      'Jadwal Supervisi', 'Form Supervisi', 'Data Guru Supervisi', 'Penugasan Supervisi', 'Tanda Tangan Supervisi', 'Slideshow Login',
      'Cetak Rapor', 'Cetak Identitas', 'Cetak PKL', 'Cetak Cover', 'Cetak Data Sekolah', 'Cetak Nilai Tengah Semester', 'Cetak Analisis Nilai',
      'Cetak Buku Induk', 'Cetak Cover Buku Induk', 'Unduh PDF', 'Unduh Excel', 'Unduh ZIP Excel', 'Unduh Excel Buku Induk'];
    var opsiModul = '<option value="">Semua modul</option>' + daftarModul.map(function (m) {
      return '<option value="' + escapeHtml(m) + '">' + escapeHtml(m) + '</option>';
    }).join('');

    document.getElementById('lgNote').outerHTML =
      '<form class="add-form" id="lgForm" style="flex-wrap:wrap;">' +
      '<div class="field"><label>Dari tanggal</label><input type="date" id="lgDari"></div>' +
      '<div class="field"><label>Sampai tanggal</label><input type="date" id="lgSampai"></div>' +
      '<div class="field"><label>Aplikasi</label><select id="lgApp">' + opsiApp + '</select></div>' +
      '<div class="field"><label>Peran</label><select id="lgPeran"><option value="">Semua peran</option><option value="admin">Admin</option><option value="guru">Guru</option><option value="siswa">Siswa</option><option value="sistem">Sistem / SQL</option></select></div>' +
      '<div class="field"><label>Pengguna</label><select id="lgUser">' + opsiAkun + '</select></div>' +
      '<div class="field"><label>Aksi</label><select id="lgAksi"><option value="">Semua aksi</option><option value="tambah">Tambah</option><option value="ubah">Ubah</option><option value="hapus">Hapus</option><option value="login">Login</option><option value="logout">Logout</option><option value="cetak">Cetak</option><option value="unduh">Unduh</option></select></div>' +
      '<div class="field"><label>Modul</label><select id="lgModul">' + opsiModul + '</select></div>' +
      '<div class="field"><label>Cari (nama / keterangan)</label><input type="text" id="lgCari" placeholder="mis. nama siswa atau guru"></div>' +
      '<button type="submit" class="btn-small btn-small--primary"><i data-lucide="search" style="width:14px;height:14px;"></i> Terapkan</button>' +
      '<button type="button" class="btn-small" id="lgReset">Reset</button>' +
      '</form>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0;">' +
      '<span class="panel-note" id="lgInfo" style="margin:0;flex:1;min-width:200px;">Memuat...</span>' +
      '<button type="button" class="btn-small" id="lgMuat"><i data-lucide="refresh-cw" style="width:14px;height:14px;"></i> Muat ulang</button>' +
      '<button type="button" class="btn-small" id="lgCsv"><i data-lucide="download" style="width:14px;height:14px;"></i> Unduh CSV</button>' +
      '<button type="button" class="btn-small btn-small--danger" id="lgBersih"><i data-lucide="trash-2" style="width:14px;height:14px;"></i> Bersihkan log lama</button>' +
      '</div>' +
      '<div class="table-wrap"><table class="data-table"><thead><tr><th>Waktu (WIB)</th><th>Pengguna</th><th>Aplikasi</th><th>Aktivitas</th><th style="text-align:center;">Jumlah</th><th></th></tr></thead><tbody id="lgBody"></tbody></table></div>' +
      '<div style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;">' +
      '<button type="button" class="btn-small" id="lgPrev">&laquo; Sebelumnya</button>' +
      '<span class="panel-note" id="lgHal" style="margin:0;"></span>' +
      '<button type="button" class="btn-small" id="lgNext">Berikutnya &raquo;</button></div>';
    lucide.createIcons();

    var elBody = document.getElementById('lgBody');
    var elInfo = document.getElementById('lgInfo');

    function nilaiFilter() {
      return {
        dari: document.getElementById('lgDari').value,
        sampai: document.getElementById('lgSampai').value,
        app: document.getElementById('lgApp').value,
        peran: document.getElementById('lgPeran').value,
        user: document.getElementById('lgUser').value,
        aksi: document.getElementById('lgAksi').value,
        modul: document.getElementById('lgModul').value,
        cari: document.getElementById('lgCari').value.replace(/[,()%*\\]/g, ' ').trim()
      };
    }

    function bangunQuery(f, dgCount) {
      var q = supabaseClient.from('log_aktivitas').select('*', dgCount ? { count: 'exact' } : undefined).order('waktu_akhir', { ascending: false });
      if (f.dari) q = q.gte('waktu_akhir', f.dari + 'T00:00:00+07:00');
      if (f.sampai) q = q.lte('waktu_akhir', f.sampai + 'T23:59:59.999+07:00');
      if (f.app) q = q.eq('aplikasi', f.app);
      if (f.peran) q = q.eq('user_role', f.peran);
      if (f.user) q = q.eq('user_id', f.user);
      if (f.aksi) q = q.eq('aksi', f.aksi);
      if (f.modul) q = q.eq('modul', f.modul);
      if (f.cari) q = q.or('ringkasan.ilike.%' + f.cari + '%,user_nama.ilike.%' + f.cari + '%,modul.ilike.%' + f.cari + '%');
      return q;
    }

    function fmtWaktu(iso, denganTanggal) {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      var opsi = denganTanggal
        ? { timeZone: 'Asia/Jakarta', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }
        : { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit' };
      return d.toLocaleString('id-ID', opsi);
    }
    function fmtRentang(r) {
      var a = new Date(r.waktu).getTime(), b = new Date(r.waktu_akhir).getTime();
      var teks = fmtWaktu(r.waktu, true);
      if (b - a > 60000) teks += ' – ' + fmtWaktu(r.waktu_akhir, false);
      return teks;
    }
    function teksAktivitas(r) {
      var j = r.jumlah || 1;
      if (r.aksi === 'tambah') return 'Menambah ' + j + ' data ' + r.modul;
      if (r.aksi === 'ubah') return 'Mengubah ' + j + ' data ' + r.modul;
      if (r.aksi === 'hapus') return 'Menghapus ' + j + ' data ' + r.modul;
      if (r.aksi === 'login') return 'Login' + (r.ringkasan ? ' — ' + r.ringkasan : '');
      if (r.aksi === 'logout') return 'Logout';
      return r.modul + (r.ringkasan ? ' — ' + r.ringkasan : '');
    }
    function chipAksi(a) {
      var kelas = { tambah: 'chip chip--aktif', hapus: 'chip chip--danger', ubah: 'chip', cetak: 'chip', unduh: 'chip' }[a] || 'chip chip--muted';
      var label = { tambah: 'Tambah', ubah: 'Ubah', hapus: 'Hapus', login: 'Login', logout: 'Logout', cetak: 'Cetak', unduh: 'Unduh' }[a] || 'Lainnya';
      return '<span class="' + kelas + '">' + label + '</span>';
    }
    function chipApp(a) {
      return '<span class="chip chip--muted">' + escapeHtml(a || '-') + '</span>';
    }
    function chipPeran(p) {
      var label = { admin: 'Admin', guru: 'Guru', siswa: 'Siswa', sistem: 'Sistem' }[p] || (p || '-');
      return '<span class="chip chip--muted">' + escapeHtml(label) + '</span>';
    }
    function nilaiTeks(v) {
      if (v === null || v === undefined || v === '') return '∅';
      return String(v);
    }
    function rincianHtml(r) {
      var items = Array.isArray(r.detail) ? r.detail : [];
      if (!items.length) return '<div class="panel-note" style="margin:0;">Tidak ada rincian.</div>';
      var html = items.map(function (it) {
        var d = it.d || {};
        var kolom = Object.keys(d).map(function (k) {
          var v = d[k];
          var nama = escapeHtml(k.replace(/_/g, ' '));
          if (r.aksi === 'ubah' && Array.isArray(v)) {
            return '<span style="display:inline-block;margin:2px 10px 2px 0;"><b>' + nama + ':</b> <s style="opacity:.6;">' + escapeHtml(nilaiTeks(v[0])) + '</s> → <b>' + escapeHtml(nilaiTeks(v[1])) + '</b></span>';
          }
          return '<span style="display:inline-block;margin:2px 10px 2px 0;"><b>' + nama + ':</b> ' + escapeHtml(nilaiTeks(v)) + '</span>';
        }).join('');
        return '<div style="padding:6px 0;border-bottom:1px dashed var(--border);"><div style="font-weight:600;">' + escapeHtml(it.l || '(tanpa label)') + '</div><div style="font-size:12.5px;">' + kolom + '</div></div>';
      }).join('');
      if ((r.jumlah || 1) > items.length) {
        html += '<div class="panel-note" style="margin:8px 0 0;">… dan ' + ((r.jumlah || 1) - items.length) + ' data lainnya (rincian dibatasi ' + items.length + ' data pertama).</div>';
      }
      return html;
    }

    function tampilkan() {
      if (!rowsSekarang.length) {
        elBody.innerHTML = '<tr><td colspan="6"><div class="empty-state" style="padding:24px 0;"><div class="empty-state__title">Belum ada aktivitas yang cocok</div></div></td></tr>';
        return;
      }
      elBody.innerHTML = rowsSekarang.map(function (r, i) {
        var adaRincian = r.aksi === 'tambah' || r.aksi === 'ubah' || r.aksi === 'hapus' || (Array.isArray(r.detail) && r.detail.length);
        return '<tr>' +
          '<td style="white-space:nowrap;">' + escapeHtml(fmtRentang(r)) + '</td>' +
          '<td>' + escapeHtml(r.user_nama || '(tidak diketahui)') + '<div style="margin-top:3px;">' + chipPeran(r.user_role) + '</div></td>' +
          '<td>' + chipApp(r.aplikasi) + '</td>' +
          '<td>' + chipAksi(r.aksi) + ' ' + escapeHtml(teksAktivitas(r)) +
            ((r.aksi === 'tambah' || r.aksi === 'ubah' || r.aksi === 'hapus') && r.ringkasan ? '<div style="font-size:12px;opacity:.7;margin-top:3px;">Contoh: ' + escapeHtml(r.ringkasan) + '</div>' : '') + '</td>' +
          '<td style="text-align:center;">' + (r.jumlah || 1) + '</td>' +
          '<td>' + (adaRincian ? '<button type="button" class="btn-small" data-rinci="' + i + '">Rincian</button>' : '') + '</td>' +
          '</tr>' +
          '<tr class="lgRinci" id="lgRinci' + i + '" style="display:none;"><td colspan="6" style="background:var(--surface-tint-strong);">' + rincianHtml(r) +
          (r.ip ? '<div class="panel-note" style="margin:8px 0 0;">IP: ' + escapeHtml(r.ip) + '</div>' : '') + '</td></tr>';
      }).join('');
    }

    async function muat() {
      elBody.innerHTML = '<tr><td colspan="6">Memuat...</td></tr>';
      var f = nilaiFilter();
      var dari = halaman * UKURAN;
      var res = await bangunQuery(f, true).range(dari, dari + UKURAN - 1);
      if (res.error) {
        elBody.innerHTML = '';
        if (/aplikasi/i.test(res.error.message || '')) {
          elInfo.innerHTML = 'Kolom <b>aplikasi</b> belum ada. Jalankan <b>migrasi_log_aplikasi.sql</b> di Supabase (SQL Editor) terlebih dahulu.';
        } else if (/log_aktivitas|42P01|does not exist|schema cache/i.test((res.error.message || '') + (res.error.code || ''))) {
          elInfo.innerHTML = 'Tabel <b>log_aktivitas</b> belum ada. Jalankan <b>migrasi_log_aktivitas.sql</b> di Supabase (SQL Editor) terlebih dahulu.';
        } else {
          elInfo.textContent = 'Gagal memuat log: ' + res.error.message;
        }
        return;
      }
      rowsSekarang = res.data || [];
      totalBaris = res.count || 0;
      var jumlahHal = Math.max(1, Math.ceil(totalBaris / UKURAN));
      if (halaman > jumlahHal - 1 && totalBaris > 0) { halaman = jumlahHal - 1; return muat(); }
      elInfo.textContent = totalBaris + ' aktivitas ditemukan.';
      document.getElementById('lgHal').textContent = 'Halaman ' + (halaman + 1) + ' dari ' + jumlahHal;
      document.getElementById('lgPrev').disabled = halaman <= 0;
      document.getElementById('lgNext').disabled = halaman >= jumlahHal - 1;
      tampilkan();
    }

    elBody.addEventListener('click', function (e) {
      var b = e.target.closest('[data-rinci]');
      if (!b) return;
      var tr = document.getElementById('lgRinci' + b.getAttribute('data-rinci'));
      if (!tr) return;
      var buka = tr.style.display === 'none';
      tr.style.display = buka ? '' : 'none';
      b.textContent = buka ? 'Tutup' : 'Rincian';
    });

    document.getElementById('lgForm').addEventListener('submit', function (e) { e.preventDefault(); halaman = 0; muat(); });
    document.getElementById('lgReset').addEventListener('click', function () {
      document.getElementById('lgForm').reset();
      halaman = 0; muat();
    });
    document.getElementById('lgMuat').addEventListener('click', muat);
    document.getElementById('lgPrev').addEventListener('click', function () { if (halaman > 0) { halaman--; muat(); } });
    document.getElementById('lgNext').addEventListener('click', function () { halaman++; muat(); });

    document.getElementById('lgCsv').addEventListener('click', async function () {
      var btn = this; btn.disabled = true;
      try {
        var f = nilaiFilter(), semuaBaris = [], dari = 0, BATAS = 5000;
        for (;;) {
          var r = await bangunQuery(f, false).range(dari, dari + 999);
          if (r.error) throw r.error;
          semuaBaris = semuaBaris.concat(r.data || []);
          if (!r.data || r.data.length < 1000 || semuaBaris.length >= BATAS) break;
          dari += 1000;
        }
        if (!semuaBaris.length) { alert('Tidak ada data untuk diunduh.'); return; }
        function sel(v) { return '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"'; }
        var baris = [['Waktu (WIB)', 'Pengguna', 'Peran', 'Aplikasi', 'Aksi', 'Modul', 'Jumlah', 'Keterangan', 'Rincian', 'IP'].map(sel).join(',')];
        semuaBaris.forEach(function (x) {
          var rinci = (Array.isArray(x.detail) ? x.detail : []).map(function (it) {
            var d = it.d || {};
            return (it.l || '') + ' [' + Object.keys(d).map(function (k) {
              var v = d[k];
              return k + '=' + (Array.isArray(v) ? nilaiTeks(v[0]) + '→' + nilaiTeks(v[1]) : nilaiTeks(v));
            }).join('; ') + ']';
          }).join(' | ');
          baris.push([fmtRentang(x), x.user_nama, x.user_role, x.aplikasi, x.aksi, x.modul, x.jumlah, teksAktivitas(x), rinci, x.ip].map(sel).join(','));
        });
        var blob = new Blob(['\uFEFF' + baris.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'log-aktivitas-' + new Date().toISOString().slice(0, 10) + '.csv';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
        if (semuaBaris.length >= BATAS) alert('Diunduh ' + BATAS + ' baris terbaru. Persempit filter tanggal untuk data lainnya.');
      } catch (err) {
        alert('Gagal mengunduh: ' + (err && err.message ? err.message : err));
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('lgBersih').addEventListener('click', async function () {
      var jawab = prompt('Hapus log yang lebih lama dari berapa hari? (minimal 7)', '180');
      if (jawab === null) return;
      var hari = parseInt(jawab, 10);
      if (isNaN(hari) || hari < 7) { alert('Isi angka minimal 7.'); return; }
      if (!confirm('Hapus semua log aktivitas yang lebih lama dari ' + hari + ' hari? Tindakan ini tidak bisa dibatalkan.')) return;
      var r = await supabaseClient.rpc('hapus_log_aktivitas_lama', { p_hari: hari });
      if (r.error) { alert('Gagal menghapus: ' + r.error.message); return; }
      alert(r.data + ' baris log dihapus.');
      halaman = 0; muat();
    });

    muat();
  }


  var views = {
    semua:      function () { return renderLogAktivitas({ judul: 'Log Aktivitas — Semua' }); },
    erapor:     function () { return renderLogAktivitas({ judul: 'Log Aktivitas — E-Rapor', aplikasi: 'E-Rapor' }); },
    bukuinduk:  function () { return renderLogAktivitas({ judul: 'Log Aktivitas — Buku Induk', aplikasi: 'Buku Induk' }); },
    pkl:        function () { return renderLogAktivitas({ judul: 'Log Aktivitas — PKL', aplikasi: 'PKL' }); },
    supervisi:  function () { return renderLogAktivitas({ judul: 'Log Aktivitas — Supervisi', aplikasi: 'Supervisi' }); },
    pengaturan: function () { return renderLogAktivitas({ judul: 'Log Aktivitas — Pengaturan Sekolah', aplikasi: 'Pengaturan Sekolah' }); },
    akun:       function () { return renderLogAktivitas({ judul: 'Log Aktivitas — Login & Akun', aplikasi: 'Akun' }); }
  };

  function bukaView(nama) {
    if (!views[nama]) nama = 'semua';
    setActiveMenu(nama);
    views[nama]();
  }

  document.querySelectorAll('#menuAdmin .menu-item').forEach(function (item) {
    item.addEventListener('click', function (e) {
      e.preventDefault();
      var v = item.dataset.view;
      try { history.replaceState(null, '', '#' + v); } catch (err) {}
      bukaView(v);
    });
  });

  (async function () {
    var sessionResult = await supabaseClient.auth.getSession();
    var session = sessionResult.data.session;
    if (!session) { window.location.href = 'index.html'; return; }
    var user = session.user;

    // Hanya admin (log memang hanya bisa dibaca admin lewat RLS)
    var profileResult = await supabaseClient.from('profiles').select('nama, role').eq('id', user.id).single();
    if (profileResult.error || !profileResult.data || profileResult.data.role !== 'admin') { window.location.href = 'portal.html'; return; }

    var nama = profileResult.data.nama || user.email;
    document.getElementById('userName').textContent = nama;
    document.getElementById('userAvatar').textContent = nama.trim().charAt(0).toUpperCase();

    bukaView((location.hash || '').replace('#', ''));
  })();

  document.getElementById('logoutBtn').addEventListener('click', async function (e) {
    e.preventDefault();
    await catatAktivitas('logout', 'Akun', 'Keluar dari aplikasi');
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  });
</script>

</body>
</html>
