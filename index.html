<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — SMK Widya Mandala Tambak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=10">
<link rel="stylesheet" href="slideshow.css?v=2">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
</head>
<body>

<div class="login-shell" id="loginShell">

  <div class="login-left" id="loginLeft" style="display:none;">
    <div class="login-slideshow" id="loginSlideshow">
      <div class="login-slideshow__track" id="loginSlideshowTrack"></div>
      <div class="login-slideshow__dots" id="loginSlideshowDots"></div>
    </div>
    <a href="panduan-guru.html" target="_blank" rel="noopener" class="btn-panduan">
      <i data-lucide="book-open"></i> BACA PANDUAN
    </a>
  </div>

  <form class="login-card" id="loginForm">

    <div class="login-card__icon">
      <img src="assets/logo.png" alt="Logo SMK Widya Mandala Tambak">
    </div>

    <div class="login-card__title" id="loginTitle">Masuk</div>
    <div class="login-card__sub">SMK Widya Mandala Tambak — Banyumas<br>Buku Induk · E-Rapor · Supervisi</div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="nama@sekolah.sch.id" autocomplete="username">
    </div>

    <div class="field">
      <label for="password">Kata sandi</label>
      <div style="position:relative;">
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" style="padding-right:42px;">
        <button type="button" onclick="togglePassword()" style="position:absolute; top:0; right:0; bottom:0; width:40px; display:flex; align-items:center; justify-content:center; background:none; border:none; color:var(--ink-faint); cursor:pointer;">
          <i data-lucide="eye" id="eyeIcon" style="width:18px; height:18px;"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-primary" id="submitBtn">Masuk</button>

    <div class="login-card__note" id="loginNote">Peran (guru/admin) ditentukan otomatis berdasarkan akun kamu di Supabase.</div>

    <div class="login-panduan-alt">
      <a href="panduan-guru.html" target="_blank" rel="noopener" class="btn-panduan">
        <i data-lucide="book-open"></i> BACA PANDUAN
      </a>
    </div>

    <div class="login-card__foot">© <span id="year"></span> SMK Widya Mandala Tambak</div>
    <div style="text-align:center;font-size:11px;opacity:0.55;margin-top:4px;">developed by hhh</div>
  </form>

</div>

<script>
  lucide.createIcons();

  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ================= Slideshow Login =================
  // Ambil gambar (+ Judul/Deskripsi opsional) dari tabel
  // public.login_slideshow (diatur Admin lewat menu Admin →
  // "Slideshow Login"), urut sesuai kolom `urutan`. Tabel ini boleh
  // dibaca siapa saja (termasuk belum login) — lihat catatan RLS di
  // migrasi_slideshow_login.sql. Kalau belum ada gambar sama sekali
  // (atau gagal diambil), panel slideshow tetap disembunyikan dan
  // halaman Masuk tampil seperti biasa (form login di tengah).
  (async function initLoginSlideshow() {
    // Supaya slideshow muncul CEPAT: gambar disimpan sebagai base64 (besar),
    // jadi TIDAK diambil sekaligus. Alurnya:
    //   1) Kalau pernah dibuka sebelumnya, tampilkan langsung dari cache
    //      browser (hampir instan), lalu cache disegarkan di latar belakang.
    //   2) Kalau belum ada cache, ambil GAMBAR PERTAMA saja dulu -> tampil,
    //      baru sisanya diambil di latar belakang dan ditambahkan.
    var CACHE_KEY = 'login_slideshow_cache_v1';
    var DURASI = 6500; // ms per slide (bar progres di titik ikut durasi ini)
    var EFEK = ['zoom', 'geser', 'lingkar', 'tirai', 'kabur', 'balik'];

    var wrap = document.getElementById('loginSlideshow');
    var track = document.getElementById('loginSlideshowTrack');
    var dots = document.getElementById('loginSlideshowDots');
    var shell = document.getElementById('loginShell');
    var left = document.getElementById('loginLeft');

    var slideEls = [];
    var dotEls = [];
    var aktif = 0;
    var timer = null;
    var timerLeaving = null;
    var efekTerakhir = '';
    var kontrolAktif = false;
    wrap.style.setProperty('--ss-durasi', DURASI + 'ms');

    function bacaCache() {
      try {
        var raw = localStorage.getItem(CACHE_KEY);
        var arr = raw ? JSON.parse(raw) : null;
        return (arr && arr.length) ? arr : null;
      } catch (e) { return null; }
    }
    function simpanCache(arr) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(arr)); }
      catch (e) {
        // Kuota penuh -> simpan gambar pertama saja (yang paling penting).
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(arr.slice(0, 1))); } catch (e2) {}
      }
    }
    function hapusCache() { try { localStorage.removeItem(CACHE_KEY); } catch (e) {} }

    function pilihEfek() {
      var e;
      do { e = EFEK[Math.floor(Math.random() * EFEK.length)]; } while (e === efekTerakhir && EFEK.length > 1);
      efekTerakhir = e;
      return e;
    }

    // Mulai ulang animasi bar progres di titik aktif.
    function segarkanDot() {
      dotEls.forEach(function (el) { el.classList.remove('is-active'); });
      void wrap.offsetWidth; // paksa reflow supaya animasi mulai dari nol
      if (dotEls[aktif]) dotEls[aktif].classList.add('is-active');
    }

    function tampilkan(i, arah) {
      var baru = (i + slideEls.length) % slideEls.length;
      if (baru === aktif && slideEls[baru].classList.contains('is-active')) return;
      var lama = aktif;
      aktif = baru;

      track.style.setProperty('--dir', arah === -1 ? -1 : 1);
      track.setAttribute('data-efek', pilihEfek());

      slideEls.forEach(function (el, idx) {
        if (idx === aktif) { el.classList.remove('is-leaving'); el.classList.add('is-active'); }
        else if (idx === lama) { el.classList.remove('is-active'); el.classList.add('is-leaving'); }
        else { el.classList.remove('is-active', 'is-leaving'); }
      });
      segarkanDot();

      clearTimeout(timerLeaving);
      timerLeaving = setTimeout(function () {
        slideEls.forEach(function (el) { el.classList.remove('is-leaving'); });
      }, 1600);
    }

    function mulaiAutoGeser() {
      if (timer) clearInterval(timer);
      timer = null;
      if (slideEls.length < 2) return;
      timer = setInterval(function () { tampilkan(aktif + 1, 1); }, DURASI);
    }

    // Tombol panah + jeda saat hover: baru dipasang begitu ada >= 2 gambar.
    function aktifkanKontrol() {
      if (kontrolAktif) return;
      kontrolAktif = true;
      dots.style.display = '';

      var ikonKiri = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>';
      var ikonKanan = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';
      var btnPrev = document.createElement('button');
      btnPrev.type = 'button';
      btnPrev.className = 'login-slideshow__nav login-slideshow__nav--prev';
      btnPrev.setAttribute('aria-label', 'Gambar sebelumnya');
      btnPrev.innerHTML = ikonKiri;
      var btnNext = document.createElement('button');
      btnNext.type = 'button';
      btnNext.className = 'login-slideshow__nav login-slideshow__nav--next';
      btnNext.setAttribute('aria-label', 'Gambar berikutnya');
      btnNext.innerHTML = ikonKanan;
      wrap.appendChild(btnPrev);
      wrap.appendChild(btnNext);
      btnPrev.addEventListener('click', function () { tampilkan(aktif - 1, -1); mulaiAutoGeser(); });
      btnNext.addEventListener('click', function () { tampilkan(aktif + 1, 1); mulaiAutoGeser(); });

      wrap.addEventListener('mouseenter', function () {
        wrap.classList.add('is-paused');
        if (timer) { clearInterval(timer); timer = null; }
      });
      wrap.addEventListener('mouseleave', function () {
        wrap.classList.remove('is-paused');
        segarkanDot();
        mulaiAutoGeser();
      });

      segarkanDot();
      mulaiAutoGeser();
    }

    function tambahSlide(s) {
      var caption = '';
      if (s.judul || s.deskripsi) {
        caption = '<div class="login-slideshow__caption">' +
          (s.judul ? '<div class="login-slideshow__caption-title">' + escapeHtml(s.judul) + '</div>' : '') +
          (s.deskripsi ? '<div class="login-slideshow__caption-desc">' + escapeHtml(s.deskripsi) + '</div>' : '') +
          '</div>';
      }
      var el = document.createElement('div');
      el.className = 'login-slideshow__slide' + (slideEls.length === 0 ? ' is-active' : '');
      el.innerHTML = '<img src="' + s.gambar + '" alt="" decoding="async">' + caption;
      track.appendChild(el);
      slideEls.push(el);

      var dot = document.createElement('span');
      dot.className = 'login-slideshow__dot';
      dot.dataset.i = String(slideEls.length - 1);
      dot.addEventListener('click', function () {
        var tujuan = parseInt(dot.dataset.i, 10);
        tampilkan(tujuan, tujuan < aktif ? -1 : 1);
        mulaiAutoGeser();
      });
      dots.appendChild(dot);
      dotEls.push(dot);

      if (slideEls.length === 1) dots.style.display = 'none'; // 1 gambar: tanpa titik
      if (slideEls.length >= 2) aktifkanKontrol();
    }

    function tampilkanPanel() {
      left.style.display = '';
      shell.classList.add('login-shell--with-slideshow');
      segarkanDot();
    }

    function ambil() {
      return supabaseClient.from('login_slideshow').select('*')
        .order('urutan', { ascending: true }).order('created_at', { ascending: true });
    }

    try {
      var cache = bacaCache();
      if (cache) {
        // Jalur cepat: langsung tampil dari cache, lalu segarkan cache di belakang layar.
        cache.forEach(tambahSlide);
        tampilkanPanel();
        var resAll = await ambil();
        if (!resAll.error) {
          if ((resAll.data || []).length) simpanCache(resAll.data); else hapusCache();
        }
      } else {
        // Belum ada cache: ambil 1 gambar dulu supaya cepat tampil.
        var res1 = await ambil().limit(1);
        var pertama = res1.data || [];
        if (!pertama.length) return;
        tambahSlide(pertama[0]);
        tampilkanPanel();
        var resSisa = await ambil().range(1, 49);
        var sisa = resSisa.data || [];
        sisa.forEach(tambahSlide);
        simpanCache(pertama.concat(sisa));
      }
    } catch (err) {
      // Diamkan — slideshow bersifat dekoratif, kegagalan di sini
      // tidak boleh mengganggu proses login.
    }
  })();

  function togglePassword() {
    var input = document.getElementById('password');
    var icon = document.getElementById('eyeIcon');
    input.type = input.type === 'password' ? 'text' : 'password';
    icon.setAttribute('data-lucide', input.type === 'password' ? 'eye' : 'eye-off');
    lucide.createIcons();
  }

  document.getElementById('year').textContent = new Date().getFullYear();

  var form = document.getElementById('loginForm');
  var submitBtn = document.getElementById('submitBtn');
  var note = document.getElementById('loginNote');
  var noteDefault = note.textContent;

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Memeriksa...';
    note.textContent = noteDefault;
    note.style.color = '';

    // 1. Login ke Supabase Auth pakai email & password
    var authResult = await supabaseClient.auth.signInWithPassword({ email: email, password: password });

    if (authResult.error) {
      note.textContent = 'Email atau kata sandi salah.';
      note.style.color = '#B3261E';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Masuk';
      return;
    }

    var userId = authResult.data.user.id;

    // 2. Ambil role dari tabel profiles berdasarkan id user yang login
    var profileResult = await supabaseClient
      .from('profiles')
      .select('role')
      .eq('id', userId)
      .single();

    if (profileResult.error || !profileResult.data) {
      note.textContent = 'Akun ini belum punya role. Hubungi admin.';
      note.style.color = '#B3261E';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Masuk';
      return;
    }

    // 3. Arahkan sesuai role
    var role = profileResult.data.role;
    // Penanda untuk pop up sambutan di guru.html (muncul sekali per login).
    // Kunci harus sama dengan SambutanGuru.KUNCI_BARU_LOGIN di sambutan-guru.js.
    if (role !== 'admin') {
      try { sessionStorage.setItem('erapor_sambutan_baru_login', '1'); } catch (e) { /* abaikan */ }
    }
    // Setelah login, semua pengguna masuk ke Menu Utama (Buku Induk / E-Rapor / Supervisi).
    window.location.href = 'portal.html';
  });
</script>

</body>
</html>
